<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper · 马尔代夫</title>
<link rel="stylesheet" href="lib/ui.css">
<style>
  html, body { background: #19b3b5; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="desktop"></div>
<!--
  Wallpaper · 马尔代夫主题（Canvas2D：静态层 + 局部动态层，30fps）
  画风参考（thumbs/maldives.webp）：浅米黄的沙岛绕着图标，海水从岸边的白色浪花线
  往外分层——透明浅滩（看得见沙底）→ 明亮的青绿 → 深青；远处大片暗色珊瑚礁盘
  （礁块斑驳、礁间水道），礁间小鱼成群游动
  - 地形：融球场 s<0 沙岛、s>0 海（sigma/warp 同沙滩主题）
  - 静态层：8px 采样铺沙/湿沙/浅滩/浅海/深水/礁盘 + 岸边浪花点
  - 动态层：浪花呼吸（冲滩）→ 云影/云 → 鱼群 → 海龟 → 皮划艇 → 海鸟 → 阳光波光
-->
<script src="lib/terrain.js"></script>
<script src="lib/kit-2d.js"></script>
<script src="lib/host-link.js"></script>
<script>
'use strict';
window.THEME = {
  title: '马尔代夫 · 原型',
  // 默认值要和 themes.json 里马尔代夫的 default 保持一致
  params: { sigma: 85, warp: 34, shoal: 110, shallow: 260, flow: 1, fishSchools: 4, palms: 4, kayaks: 2, birds: 3, turtles: 1 },
  sliders: [
    { key: 'sigma',   label: '离岸距离', min: 40,  max: 200, step: 1,    fmt: v => v + ' px' },
    { key: 'warp',    label: '海岸曲折', min: 0,   max: 80,  step: 1,    fmt: v => v + '' },
    { key: 'shoal',   label: '透明浅滩', min: 0,   max: 300, step: 1,    fmt: v => v + ' px' },
    { key: 'shallow', label: '浅海宽度', min: 120, max: 700, step: 1,    fmt: v => v + ' px' },
    { key: 'flow',    label: '流动速度', min: 0,   max: 3,   step: 0.05, fmt: v => '×' + v.toFixed(2) },
    { key: 'fishSchools', label: '鱼群',   min: 0, max: 8, step: 1, fmt: v => v + ' 群' },
    { key: 'palms',   label: '椰子树', min: 0, max: 10, step: 1, fmt: v => v + ' 棵' },
    { key: 'kayaks',  label: '皮划艇', min: 0, max: 4,  step: 1, fmt: v => v + ' 艘' },
    { key: 'birds',   label: '海鸟',   min: 0, max: 8,  step: 1, fmt: v => v + ' 只' },
    { key: 'turtles', label: '海龟',   min: 0, max: 3,  step: 1, fmt: v => v + ' 只' },
  ],
  fieldKeys: ['sigma', 'warp'],

  init(DK) {
    const P = DK.P;
    this.dk = DK;
    DK.morph = DKT.createMorph(
      () => DK.icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 })),
      () => P.sigma, () => P.warp);
    this.fts = 0; this.ft = 0;
    // 天上的云（少量，常驻）+ 图标周围的云影用同一套
    this.sky = DK2.createFreeClouds({ getCover: () => 0.25, getFlow: () => P.flow, getH: () => DK.TASKBAR, R: 100 });
    this.mass = DK2.createCloudMass({ morph: DK.morph, getEdge: () => 8, R: 76 });
    // 波光点
    this.sparkles = [];
    for (let i = 0; i < 80; i++)
      this.sparkles.push({ x: Math.random() * DK.W, y: Math.random() * (DK.H - DK.TASKBAR), ph: Math.random() * 6.283, len: 5 + Math.random() * 10 });
    this.pendingBuild = true;
    this.foam = []; this.schools = []; this.palms = [];
    this.buildIsland();
    this.kayaks = [];
    this.turtles = [];
    this.birds = [];
    this.syncFauna();
  },

  /* ============================================================
     岛屿与海：采样铺色数据在静态层画；浪花点/鱼群锚点在这里收集
     ============================================================ */
  buildIsland() {
    const DK = this.dk, morph = DK.morph, P = DK.P;
    if (!morph.FB) { this.pendingBuild = true; return; }
    this.pendingBuild = false;
    const W = DK.W, H = DK.H, sB = morph.FB.s;
    MDSeedV = DKT.getSeed() | 1;                   // 岛屿随机数跟种子走
    // 岸边浪花点：s∈[1,9] 的采样点收集起来（动态层按相位呼吸 = 浪冲滩）
    this.foam = [];
    // 鱼群锚点：珊瑚礁盘上（s 大于浅海宽度）
    this.schools = [];
    // 椰子树：沙岛上（s < -40），离图标群中心随机散布
    this.palms = [];
    const rnd = MDSeed();
    for (let k = 0; k < 600; k++) {
      const x = 20 + rnd() * (W - 40), y = 10 + rnd() * (H - 20);
      const sv = DKT.sampleArr(sB, x, y);
      if (sv > 1 && sv < 9 && this.foam.length < 1500) this.foam.push([x, y, sv, rnd() * 6.283]);
      if (sv > P.shallow + P.shoal * 0.5 && this.schools.length < 8 && rnd() < 0.02)
        this.schools.push({ x, y, ax: x, ay: y, a: rnd() * 6.283, r1: 40 + rnd() * 50, r2: 26 + rnd() * 34, sp: 0.3 + rnd() * 0.3, fish: [] });
      if (sv < -50 && this.palms.length < 10 && rnd() < 0.03 &&
          this.palms.every(p => Math.hypot(p.x - x, p.y - y) > 90))
        this.palms.push({ x, y, s: 26 + rnd() * 14, lean: (rnd() - 0.5) * 0.5, ph: rnd() * 6.283 });
    }
    this.dk.invalidate();
  },

  /* ============================================================
     静态层：沙岛 + 分层海水 + 珊瑚礁
     ============================================================ */
  drawStatic(ctx, s) {
    const DK = this.dk, morph = DK.morph, P = DK.P;
    if (this.pendingBuild) this.buildIsland();
    if (!morph.FB) return;
    const W = DK.W, H = DK.H, sB = morph.FB.s;
    // 海水底色（深青），沙岛覆盖在其上
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#1cc6c3'); g.addColorStop(1, '#178f96');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // 采样铺色：沙岛 / 湿沙 / 透明浅滩 / 浅海 / 深水 / 珊瑚礁
    const ST = 8;
    for (let gy = 0; gy * ST < H; gy++)
      for (let gx = 0; gx * ST < W; gx++) {
        const x = gx * ST + ST / 2, y = gy * ST + ST / 2;
        const sv = DKT.sampleArr(sB, x, y);
        const n = DKT.hash2(gx, gy, 96);
        if (sv < -16) {
          // 干沙：浅米黄 + 细沙颗粒
          ctx.fillStyle = n < 0.5 ? 'rgba(250,240,220,0.95)' : 'rgba(244,232,206,0.95)';
          ctx.fillRect(gx * ST, gy * ST, ST, ST);
          if (n > 0.9) { ctx.fillStyle = 'rgba(210,190,150,0.5)'; ctx.fillRect(gx * ST + n * 6, gy * ST + n * 4, 1.4, 1.4); }
        } else if (sv < 2) {
          // 湿沙：被浪打湿的一圈
          ctx.fillStyle = 'rgba(236,217,184,0.9)';
          ctx.fillRect(gx * ST, gy * ST, ST, ST);
        } else if (sv < P.shoal * 0.35 + 2) {
          // 透明浅滩：沙底透出来（水色越远越浓）
          const k = 1 - (sv - 2) / (P.shoal * 0.35);
          ctx.fillStyle = 'rgba(184,238,224,' + (0.45 + 0.35 * (1 - k)).toFixed(3) + ')';
          ctx.fillRect(gx * ST, gy * ST, ST, ST);
        } else if (sv < P.shallow * 0.6) {
          // 明亮的青绿浅海
          const k = (sv - P.shoal * 0.35 - 2) / (P.shallow * 0.6 - P.shoal * 0.35);
          ctx.fillStyle = mix2([38, 218, 209], [28, 198, 195], Math.min(1, Math.max(0, k)));
          ctx.fillRect(gx * ST, gy * ST, ST, ST);
        } else {
          // 深青海 + 珊瑚礁盘（低频噪声聚出成片的暗礁，礁间留水道）
          const reef = DKT.vnoise(gx * 0.075, gy * 0.075, 7);
          if (sv > P.shallow + 150 && reef > 0.62) {
            // 礁盘：暗青的礁块，深浅斑驳
            ctx.fillStyle = n < 0.5 ? 'rgba(20,104,100,0.75)' : 'rgba(24,116,110,0.75)';
            ctx.fillRect(gx * ST, gy * ST, ST, ST);
            if (n > 0.9) { ctx.fillStyle = 'rgba(12,84,82,0.8)'; ctx.fillRect(gx * ST + 1, gy * ST + 1, 4, 4); }
          }
        }
      }
    // 沙岛上的静态底噪：细沙点已并入上面的沙格
  },

  /* ============================================================
     动态层：浪花呼吸 → 云影/云 → 鱼群 → 海龟 → 皮划艇 → 海鸟 → 波光
     ============================================================ */
  frame(now, dt, ctx, s) {
    const DK = this.dk, P = DK.P;
    this.ft += dt;
    this.fts += dt * P.flow;
    const wave = Math.sin(this.fts * 0.9);            // 浪的呼吸（冲滩的节奏）
    // 1) 浪花：岸边泡沫点按相位闪烁，湿沙上的薄水随浪推进/退去（alpha 呼吸）
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (const [x, y, sv, ph] of this.foam) {
      const tw = Math.sin(this.fts * 1.5 + ph) * 0.5 + 0.5;
      if (tw < 0.4) continue;
      ctx.globalAlpha = 0.5 + 0.4 * tw;
      ctx.fillRect(x - 1.6, y - 0.7, 3.2, 1.4);
    }
    ctx.globalAlpha = 1;
    // 2) 云影与云
    const mass = this.mass.update(now / 1000, this.fts, DK.W, DK.H);
    const SHADOW = { body: 'rgba(8,80,88,0.26)', edge: 'rgba(8,80,88,0.26)', shade: 'rgba(8,80,88,0.26)' };
    DK2.paintCloud(ctx, mass.map((v, i) => i % 4 === 0 ? v + 105 : i % 4 === 1 ? v + 142 : v), {}, SHADOW);
    for (const c of this.sky.list)
      DK2.paintCloud(ctx, DK2.expandCloud(c, this.fts, 105, 142), {}, SHADOW);
    // 3) 鱼群：群心绕锚点利萨如漫游，个体在群心周围小范围游动
    const wantSchools = P.fishSchools | 0;
    while (this.schools.length > wantSchools) this.schools.pop();
    for (let i = 0; this.schools.length < wantSchools && i < 50; i++) {
      const sp = this.spawnSchool();
      if (!sp) break;
      this.schools.push(sp);
    }
    ctx.save();
    for (const sc of this.schools) {
      sc.a += sc.sp * dt * P.flow;
      sc.ax = sc.x + Math.cos(sc.a) * sc.r1 + Math.sin(sc.a * 1.7) * 18;
      sc.ay = sc.y + Math.sin(sc.a * 1.13) * sc.r2;
      if (!sc.fish.length)
        for (let i = 0; i < 9 + (sc.r1 | 0) % 5; i++)
          sc.fish.push({ o: Math.random() * 6.283, d: 6 + Math.random() * 22, sp: 0.8 + Math.random() * 0.8, s: 0.8 + Math.random() * 0.5, flip: Math.random() < 0.3 });
      for (const f of sc.fish) {
        const fa = f.o + this.fts * f.sp * P.flow;
        const fx = sc.ax + Math.cos(fa) * f.d, fy = sc.ay + Math.sin(fa * 1.3) * f.d * 0.7;
        const fa2 = fa + Math.PI / 2;                 // 鱼头朝切线方向
        ctx.save();
        ctx.translate(fx, fy); ctx.rotate(fa2);
        ctx.fillStyle = f.flip ? 'rgba(24,120,116,0.9)' : 'rgba(216,240,236,0.9)';
        ctx.beginPath(); ctx.ellipse(0, 0, 3.4 * f.s, 1.3 * f.s, 0, 0, 6.283); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-3 * f.s, 0); ctx.lineTo(-5.4 * f.s, -1.5 * f.s + Math.sin(this.fts * 8 + f.o) * 0.7); ctx.lineTo(-5.4 * f.s, 1.5 * f.s);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
    // 4) 海龟：慢悠悠地游，避开岛
    this.syncTurtles();
    for (const t of this.turtles) {
      const ax = t.x + Math.cos(t.h) * 50, ay = t.y + Math.sin(t.h) * 50;
      if (DK.morph.sample(ax, ay) < 30) {
        const gx = DK.morph.sample(t.x + 10, t.y) - DK.morph.sample(t.x - 10, t.y);
        const gy = DK.morph.sample(t.x, t.y + 10) - DK.morph.sample(t.x, t.y - 10);
        let d = Math.atan2(gy, gx) - t.h;
        d = Math.atan2(Math.sin(d), Math.cos(d));
        t.h += Math.sign(d) * Math.min(Math.abs(d), 0.8 * dt);
      } else t.h += (DKT.vnoise(t.wander += dt * 0.2, 9) - 0.5) * 0.25 * dt;
      t.x += Math.cos(t.h) * 7.5 * dt; t.y += Math.sin(t.h) * 7.5 * dt;
      ctx.save();
      ctx.translate(t.x, t.y); ctx.rotate(t.h);
      const flip = Math.sin(this.fts * 2.2 + t.ph) * 0.35;
      ctx.fillStyle = 'rgba(16,84,88,0.55)';                                     // 影
      ctx.beginPath(); ctx.ellipse(5, 10, 11, 4.4, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#2a7a62'; ctx.strokeStyle = '#1a5a4c'; ctx.lineWidth = 1;  // 壳
      ctx.beginPath(); ctx.ellipse(0, 0, 10.5, 8, 0, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3a8a70';                                                  // 壳纹
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.ellipse(i * 5.5, 0, 2.6, 3.4, 0, 0, 6.283); ctx.fill();
      }
      ctx.fillStyle = '#35826a';                                                  // 头
      ctx.beginPath(); ctx.ellipse(12.5, 0, 3, 2.4, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#2a7a62';                                                  // 四鳍（划水）
      for (const sd of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(4, sd * 8.4, 4.4, 1.9, sd * (0.5 + flip), 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-7, sd * 7, 3.4, 1.6, sd * (0.7 - flip), 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }
    // 5) 皮划艇：浅海里慢划，桨一起一落
    this.syncKayaks();
    for (const k of this.kayaks) {
      const ax = k.x + Math.cos(k.h) * 56, ay = k.y + Math.sin(k.h) * 56;
      if (DK.morph.sample(ax, ay) < 45) {
        const gx = DK.morph.sample(k.x + 10, k.y) - DK.morph.sample(k.x - 10, k.y);
        const gy = DK.morph.sample(k.x, k.y + 10) - DK.morph.sample(k.x, k.y - 10);
        let d = Math.atan2(gy, gx) - k.h;
        d = Math.atan2(Math.sin(d), Math.cos(d));
        k.h += Math.sign(d) * Math.min(Math.abs(d), dt);
      } else k.h += (DKT.vnoise(k.wander += dt * 0.3, 11) - 0.5) * 0.3 * dt;
      k.ph += dt * 2.2;
      const v = 13 * (0.72 + 0.28 * Math.abs(Math.sin(k.ph)));
      k.x += Math.cos(k.h) * v * dt; k.y += Math.sin(k.h) * v * dt;
      if (DK.morph.sample(k.x, k.y) < 22) { const n = this.spawnKayak(); if (n) Object.assign(k, n); }
      ctx.save();
      ctx.translate(k.x, k.y); ctx.rotate(k.h);
      ctx.fillStyle = 'rgba(10,90,92,0.45)';                                      // 影
      ctx.beginPath(); ctx.ellipse(5, 9, 14, 4, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#f8d838';                                                  // 船身
      ctx.beginPath();
      ctx.moveTo(13, 0); ctx.quadraticCurveTo(6, -4.6, -8, -4);
      ctx.lineTo(-12, -2.4); ctx.lineTo(-12, 2.4); ctx.lineTo(-8, 4);
      ctx.quadraticCurveTo(6, 4.6, 13, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(180,140,30,0.7)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#e8682e';                                                  // 人：救生衣
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#3a2e28';                                                  // 头
      ctx.beginPath(); ctx.arc(0.6, 0, 1.9, 0, 6.283); ctx.fill();
      const pa = 1.5708 + Math.sin(k.ph) * 0.55;                                  // 桨（一起一落）
      ctx.strokeStyle = '#5a4638'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(pa) * 10, Math.sin(pa) * 10);
      ctx.lineTo(-Math.cos(pa) * 10, -Math.sin(pa) * 10);
      ctx.stroke();
      ctx.fillStyle = '#c04838';
      ctx.beginPath(); ctx.arc(Math.cos(pa) * 10, Math.sin(pa) * 10, 2.4, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(-Math.cos(pa) * 10, -Math.sin(pa) * 10, 2.4, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    // 6) 海鸟（俯视海鸥，复用大海的画法）
    this.syncBirds();
    this.stepBirds(dt);
    for (const b of this.birds) this.drawBird(ctx, b);
    // 7) 椰子树：弯干 + 随风摆的长叶 + 椰子
    this.syncPalms();
    for (const p of this.palms) this.drawPalm(ctx, p);
    // 8) 阳光波光
    ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (const sp of this.sparkles) {
      if (DK.morph.sample(sp.x, sp.y) < 40) continue;
      const tw = 0.4 + 0.6 * Math.sin(this.fts * 1.2 + sp.ph);
      if (tw < 0.55) continue;
      ctx.strokeStyle = 'rgba(240,255,250,' + (0.65 * tw).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(sp.x - sp.len / 2, sp.y); ctx.lineTo(sp.x + sp.len / 2, sp.y); ctx.stroke();
    }
    // 9) 涟漪
    for (const r of DK.ripples) {
      const age = (performance.now() - r.t0) / 1000;
      if (age > 3) continue;
      ctx.strokeStyle = 'rgba(240,255,250,' + (0.6 * (1 - age / 3)).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(r.x, r.y, age * 80 * r.str, 0, 6.283); ctx.stroke();
    }
  },

  /* ---------- 小系统：出生 / 同步 / 绘制 ---------- */
  spawnSchool() {
    const DK = this.dk, P = DK.P;
    for (let t = 0; t < 120; t++) {
      const x = 60 + Math.random() * (DK.W - 120), y = 40 + Math.random() * (DK.H - DK.TASKBAR - 80);
      if (DK.morph.sample(x, y) > P.shallow * 0.5 + P.shoal * 0.4)
        return { x, y, ax: x, ay: y, a: Math.random() * 6.283, r1: 40 + Math.random() * 50, r2: 26 + Math.random() * 34, sp: 0.3 + Math.random() * 0.3, fish: [] };
    }
    return null;
  },
  spawnKayak() {
    const DK = this.dk;
    for (let t = 0; t < 300; t++) {
      const x = 60 + Math.random() * (DK.W - 120), y = 40 + Math.random() * (DK.H - DK.TASKBAR - 80);
      const sv = DK.morph.sample(x, y);
      if (sv > 50 && sv < DK.P.shallow && this.kayaks.every(k => Math.hypot(k.x - x, k.y - y) > 160))
        return { x, y, h: Math.random() * 6.283, ph: Math.random() * 6.283, wander: Math.random() * 100 };
    }
    return null;
  },
  syncKayaks() {
    const want = this.dk.P.kayaks | 0;
    while (this.kayaks.length > want) this.kayaks.pop();
    while (this.kayaks.length < want) { const k = this.spawnKayak(); if (!k) break; this.kayaks.push(k); }
  },
  syncTurtles() {
    const DK = this.dk;
    const want = DK.P.turtles | 0;
    while (this.turtles.length > want) this.turtles.pop();
    while (this.turtles.length < want) {
      let t = null;
      for (let k = 0; k < 300 && !t; k++) {
        const x = 60 + Math.random() * (DK.W - 120), y = 40 + Math.random() * (DK.H - DK.TASKBAR - 80);
        if (DK.morph.sample(x, y) > 45 && this.turtles.every(o => Math.hypot(o.x - x, o.y - y) > 200))
          t = { x, y, h: Math.random() * 6.283, wander: Math.random() * 100, ph: Math.random() * 6.283 };
      }
      if (!t) break;
      this.turtles.push(t);
    }
  },
  syncBirds() {
    const DK = this.dk;
    const want = DK.P.birds | 0;
    while (this.birds.length > want) this.birds.pop();
    while (this.birds.length < want)
      this.birds.push({
        x: Math.random() * DK.W, y: Math.random() * (DK.H - DK.TASKBAR),
        h: Math.random() * 6.283, v: 34 + Math.random() * 16,
        mode: 0, modeT: 2 + Math.random() * 4, ph: Math.random() * 6.283, wander: Math.random() * 100,
      });
  },
  stepBirds(dt) {
    const DK = this.dk, H2 = DK.H - DK.TASKBAR, m = 90;
    this.birds.forEach((b, i) => {
      if ((b.modeT -= dt) <= 0) {
        b.mode = Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) : 0;
        b.modeT = b.mode ? 4 + Math.random() * 6 : 3 + Math.random() * 5;
      }
      b.wander += dt * 0.4;
      if (b.x < -m || b.x > DK.W + m || b.y < -m || b.y > H2 + m)
        b.h = DK2.turnToward(b.h, Math.atan2(H2 / 2 - b.y, DK.W / 2 - b.x), 1.3 * dt);
      else b.h += (b.mode * 0.55 + (DKT.vnoise(b.wander, i * 7.3) - 0.5) * 0.8) * dt;
      if (Math.cos(b.ph) < 0.97 || Math.random() < 0.002) b.ph = (b.ph + dt * 9) % 6.283;
      b.x += Math.cos(b.h) * b.v * dt; b.y += Math.sin(b.h) * b.v * dt;
    });
  },
  drawBird(ctx, b) {
    const span = 0.68 + 0.32 * Math.cos(b.ph);
    ctx.save();
    ctx.translate(b.x + 26, b.y + 42); ctx.rotate(b.h);
    ctx.fillStyle = 'rgba(10,90,92,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 2.2, 0, 0, 6.283); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.h);
    const reach = 15 * span;
    ctx.fillStyle = '#dfe5ec';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(1, side * 1.2);
      ctx.quadraticCurveTo(-3, side * reach * 0.7, -6, side * reach);
      ctx.lineTo(-1, side * reach * 0.82);
      ctx.quadraticCurveTo(3, side * reach * 0.45, 4, side * 1.2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3a4250';
      ctx.beginPath(); ctx.ellipse(-5, side * reach * 0.92, 2, 1.4, side * 0.5, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#dfe5ec';
    }
    ctx.fillStyle = '#fbfdff';
    ctx.beginPath(); ctx.ellipse(0.5, 0, 6.4, 2, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#f0b040';
    ctx.beginPath(); ctx.ellipse(7, 0, 1.6, 0.9, 0, 0, 6.283); ctx.fill();
    ctx.restore();
  },
  syncPalms() {
    const want = this.dk.P.palms | 0;
    while (this.palms.length > want) this.palms.pop();
  },
  drawPalm(ctx, p) {
    const sway = Math.sin(this.fts * 0.9 + p.ph) * 2.2;
    const top = { x: p.x + p.lean * p.s * 0.5, y: p.y - p.s };
    ctx.strokeStyle = '#8a6a48'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(p.x + p.lean * p.s * 0.2, p.y - p.s * 0.55, top.x, top.y);
    ctx.stroke();
    // 椰叶：从树顶散开的六片弧形长叶，端点随风摆
    ctx.strokeStyle = '#2a8a4e'; ctx.lineWidth = 2.6;
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * 0.9 + i * (Math.PI * 1.8 / 5);
      const L = p.s * 0.75;
      const ex = top.x + Math.cos(a) * L + sway, ey = top.y + Math.sin(a) * L * 0.62 + Math.abs(Math.cos(a)) * 6;
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.quadraticCurveTo(top.x + Math.cos(a) * L * 0.55, top.y + Math.sin(a) * L * 0.3 - 4, ex, ey);
      ctx.stroke();
    }
    ctx.fillStyle = '#6a5238';
    ctx.beginPath(); ctx.arc(top.x + 2, top.y + 3, 2.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(top.x - 3, top.y + 4, 2.2, 0, 6.283); ctx.fill();
  },

  /* ---------- 场景钩子 ---------- */
  isWater(x, y) { return this.dk.morph.sample(x, y) > 4; },
  syncFauna() { this.syncKayaks(); this.syncTurtles(); this.syncBirds(); },
  iconsChanged() { this.buildIsland(); this.syncPalms(); this.syncFauna(); },
  resized() {
    if (!this.dk) return;
    this.buildIsland(); this.sky.clear();
    this.kayaks.length = 0; this.turtles.length = 0; this.syncFauna();
  },
  seedChanged() { this.buildIsland(); this.sky.clear(); this.kayaks.length = 0; this.turtles.length = 0; this.syncFauna(); },
  onParams(changed) {
    if (changed.includes('sigma') || changed.includes('warp')) { this.buildIsland(); this.syncPalms(); this.syncFauna(); }
    if (changed.includes('fishSchools') || changed.includes('kayaks') || changed.includes('birds') || changed.includes('turtles')) this.syncFauna();
    if (changed.includes('palms')) this.syncPalms();
  },
};

/* ---------- 工具 / 配色 ---------- */
let MDSeedV = 1;
function MDSeed() {
  let a = MDSeedV;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function MDSeedSet(v) { MDSeedV = v; }
function mix2(a, b, k) {
  const r = a[0] + (b[0] - a[0]) * k | 0, g = a[1] + (b[1] - a[1]) * k | 0, bl = a[2] + (b[2] - a[2]) * k | 0;
  return `rgba(${r},${g},${bl},0.92)`;
}
